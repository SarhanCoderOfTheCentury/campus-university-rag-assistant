name: Streamlit agent checks
on:
  push:
    paths: ['streamlit-agent/**', '.github/workflows/streamlit-agent.yml']
  pull_request:
    paths: ['streamlit-agent/**', '.github/workflows/streamlit-agent.yml']
jobs:
  offline-verification:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: streamlit-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: 'streamlit-agent/requirements*.txt'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest -q
      - run: python -m scripts.verify_bundle
